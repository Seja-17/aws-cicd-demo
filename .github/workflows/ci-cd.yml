name: Build, test, publish, and deploy to AKS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-test-publish-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test with Maven
        run: ./mvnw -B clean verify

      # Pull requests verify the source without needing Azure credentials.
      - name: Log in to Azure with GitHub OIDC
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up kubectl
        if: github.event_name != 'pull_request'
        uses: azure/setup-kubectl@v4

      - name: Set up kubelogin
        if: github.event_name != 'pull_request'
        uses: azure/use-kubelogin@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          kubelogin-version: 'v0.1.7'

      - name: Log in to Azure Container Registry
        if: github.event_name != 'pull_request'
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and push container image
        if: github.event_name != 'pull_request'
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ACR_NAME.azurecr.io/cia2-taskboard:$IMAGE_TAG"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Get AKS credentials
        if: github.event_name != 'pull_request'
        run: |
          az aks get-credentials \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_CLUSTER_NAME }}" \
            --overwrite-existing
          kubelogin convert-kubeconfig -l azurecli

      - name: Deploy to Kubernetes
        if: github.event_name != 'pull_request'
        run: |
          sed "s|__IMAGE__|$IMAGE|g" k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/taskboard --timeout=180s
          kubectl get pods,service

      - name: Verify public application endpoint
        if: github.event_name != 'pull_request'
        run: |
          for attempt in {1..30}; do
            EXTERNAL_IP="$(kubectl get service taskboard -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
            if [ -n "$EXTERNAL_IP" ]; then break; fi
            sleep 10
          done
          if [ -z "$EXTERNAL_IP" ]; then
            echo "LoadBalancer did not receive an external IP in time" >&2
            kubectl describe service taskboard
            exit 1
          fi
          curl --fail --retry 12 --retry-delay 5 --retry-connrefused "http://$EXTERNAL_IP:8080/" -o /dev/null
          echo "Application is responding at http://$EXTERNAL_IP:8080/"
