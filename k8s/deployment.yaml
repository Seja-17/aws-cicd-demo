apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard
  labels:
    app: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard
  template:
    metadata:
      labels:
        app: taskboard
    spec:
      containers:
        - name: taskboard
          image: __IMAGE__
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: taskboard
spec:
  type: LoadBalancer
  selector:
    app: taskboard
  ports:
    - name: http
      port: 8080
      targetPort: http
